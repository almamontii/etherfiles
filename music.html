<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música - Etherfiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            background-image: url('images/musicbackg.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            overflow-x: auto;
            overflow-y: auto;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
            pointer-events: none;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .grain::after {
            content: '';
            height: 400vh;
            width: 400vw;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='8.0' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            position: absolute;
            top: calc(50% - 400vh / 2);
            left: calc(50% - 400vw / 2);
            animation: grain 8s steps(10) infinite;
            opacity: 0.15;
            mix-blend-mode: darken;
        }

        @keyframes grain {
            0% {
                transform: translate(0%, 0%);
            }

            10% {
                transform: translate(-3%, -2%);
            }

            20% {
                transform: translate(2%, -3%);
            }

            30% {
                transform: translate(-4%, 1%);
            }

            40% {
                transform: translate(1%, 4%);
            }

            50% {
                transform: translate(-6%, 7%);
            }

            60% {
                transform: translate(3%, -5%);
            }

            70% {
                transform: translate(-2%, 3%);
            }

            80% {
                transform: translate(5%, -1%);
            }

            90% {
                transform: translate(-1%, -4%);
            }

            100% {
                transform: translate(0%, 0%);
            }
        }

        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .back-arrow {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .back-link:hover .back-arrow {
            transform: translateX(-3px);
        }

        .main-content {
            padding: 120px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 3;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .page-subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .music-card {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .music-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: #0078d4;
        }

        .music-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 120, 212, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .music-card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .card-description {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .spotify-embed {
            width: 100%;
            height: 152px;
            border-radius: 8px;
            border: none;
            position: relative;
            z-index: 1;
        }

        .coming-soon {
            text-align: center;
            color: #888;
            font-size: 1.1rem;
            padding: 40px;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .playlists-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .playlist-item {
            background: rgba(42, 42, 42, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .playlist-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: #0078d4;
        }

        .playlist-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
        }

        .playlist-description {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .playlist-embed {
            width: 100%;
            height: 152px;
            border-radius: 8px;
            border: none;
        }

        .articles-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
            grid-auto-rows: auto;
        }

        .article-item {
            background: rgba(42, 42, 42, 0.8);
            border-radius: 12px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .article-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: #0078d4;
        }

        .article-image-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .article-item.medium .article-image-container {
            height: 250px;
        }

        .article-item.large .article-image-container {
            height: 300px;
        }

        .article-item.tall .article-image-container {
            height: 250px;
        }

        .article-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .article-item:hover .article-image {
            transform: scale(1.05);
        }

        .article-image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px;
        }

        .article-content-wrapper {
            padding: 20px;
        }

        /* Diferentes tamaños para los artículos */
        .article-item.small {
            grid-column: span 1;
            min-height: 200px;
        }

        .article-item.medium {
            grid-column: span 1;
            min-height: 280px;
        }

        .article-item.large {
            grid-column: span 2;
            min-height: 350px;
        }

        .article-item.tall {
            grid-row: span 2;
            min-height: 400px;
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .article-item.medium .article-title {
            font-size: 1.2rem;
        }

        .article-item.large .article-title {
            font-size: 1.4rem;
        }

        .article-title-overlay {
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 5px;
        }

        .article-item.medium .article-title-overlay {
            font-size: 1.4rem;
        }

        .article-item.large .article-title-overlay {
            font-size: 1.6rem;
        }

        .article-description {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .article-item.medium .article-description {
            font-size: 1rem;
        }

        .article-item.large .article-description {
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .article-embed {
            width: 100%;
            height: 152px;
            border-radius: 8px;
            border: none;
        }

        .article-item.medium .article-embed {
            height: 180px;
        }

        .article-item.large .article-embed {
            height: 220px;
        }

        @media (max-width: 768px) {
            .article-item.large {
                grid-column: span 1;
            }

            .article-item.tall {
                grid-row: span 1;
            }
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            .music-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .main-content {
                padding: 100px 15px 30px;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 2rem;
            }

            .main-content {
                padding: 90px 10px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="grain"></div>

    <div class="header">
        <a href="index.html" class="back-link">
            <span class="back-arrow">←</span>
            <span>Volver a Etherfiles</span>
        </a>
        <div style="position: fixed; top: 20px; right: 20px; z-index: 1001; display: flex; gap: 10px;">
            <a href="google-docs-importer.html" class="back-link">
                <span>📄 Importar desde Google Docs</span>
            </a>
            <a href="music-editor.html" class="back-link">
                <span>➕ Agregar Artículo</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <h1 class="page-title">Música</h1>
        <p class="page-subtitle">Rincón de música. Compilados musicales y datos curiosos de Etherfiles</p>

        <div class="music-grid">
            <div class="music-card">
                <h3 class="card-title">Articulos</h3>
                <p class="card-description"></p>
                <div class="articles-container" id="articlesContainer">
                    <!-- Los artículos se agregarán dinámicamente aquí -->
                </div>
            </div>

            <div class="music-card">
                <h3 class="card-title">MIXES</h3>
                <p class="card-description"></p>
                <div class="playlists-container" id="playlistsContainer">
                    <!-- Las playlists se agregarán dinámicamente aquí -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cargar artículos y playlists desde localStorage
        let articles = JSON.parse(localStorage.getItem('etherfiles_music_articles')) || [];
        let playlists = JSON.parse(localStorage.getItem('etherfiles_music_playlists')) || [];

        function createArticleElement(article) {
            const articleDiv = document.createElement('div');
            articleDiv.className = `article-item ${article.size || 'small'}`;
            
            // Imagen del artículo (puede ser de la carpeta images o una URL)
            let imageHTML = '';
            if (article.image) {
                const imageSrc = article.image.startsWith('http') ? article.image : `images/${article.image}`;
                imageHTML = `
                    <div class="article-image-container">
                        <img src="${imageSrc}" alt="${article.title || 'Artículo'}" class="article-image" onerror="this.parentElement.style.background='linear-gradient(135deg, #667eea 0%, #764ba2 100%)'">
                        <div class="article-image-overlay">
                            <h4 class="article-title-overlay">${article.title || 'Artículo'}</h4>
                        </div>
                    </div>
                `;
            } else {
                // Si no hay imagen, usar gradiente con título
                imageHTML = `
                    <div class="article-image-container">
                        <div class="article-image-overlay" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                            <h4 class="article-title-overlay">${article.title || 'Artículo'}</h4>
                        </div>
                    </div>
                `;
            }
            
            let embedHTML = '';
            if (article.spotifyUrl) {
                embedHTML = `<iframe class="article-embed" src="${article.spotifyUrl}" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>`;
            }
            
            articleDiv.innerHTML = `
                ${imageHTML}
                <div class="article-content-wrapper">
                    ${article.image ? '' : `<h4 class="article-title">${article.title || 'Artículo'}</h4>`}
                    ${article.description ? `<p class="article-description">${article.description}</p>` : ''}
                    ${embedHTML}
                </div>
            `;
            
            return articleDiv;
        }

        function createPlaylistElement(playlist) {
            const playlistDiv = document.createElement('div');
            playlistDiv.className = 'playlist-item';
            
            let embedHTML = '';
            if (playlist.spotifyUrl) {
                embedHTML = `<iframe class="playlist-embed" src="${playlist.spotifyUrl}" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>`;
            }
            
            playlistDiv.innerHTML = `
                <h4 class="playlist-title">${playlist.title || 'Playlist'}</h4>
                ${playlist.description ? `<p class="playlist-description">${playlist.description}</p>` : ''}
                ${embedHTML}
            `;
            
            return playlistDiv;
        }

        function loadArticles() {
            const container = document.getElementById('articlesContainer');
            if (!container) return;

            if (articles.length === 0) {
                container.innerHTML = '<div class="coming-soon">Próximamente...</div>';
                return;
            }

            container.innerHTML = '';
            articles.forEach(article => {
                const articleElement = createArticleElement(article);
                container.appendChild(articleElement);
            });
        }

        function loadPlaylists() {
            const container = document.getElementById('playlistsContainer');
            if (!container) return;

            if (playlists.length === 0) {
                container.innerHTML = '<div class="coming-soon">Próximamente...</div>';
                return;
            }

            container.innerHTML = '';
            playlists.forEach(playlist => {
                const playlistElement = createPlaylistElement(playlist);
                container.appendChild(playlistElement);
            });
        }

        // Cargar contenido cuando la página esté lista
        document.addEventListener('DOMContentLoaded', () => {
            // Recargar desde localStorage cada vez que se carga la página
            articles = JSON.parse(localStorage.getItem('etherfiles_music_articles')) || [];
            playlists = JSON.parse(localStorage.getItem('etherfiles_music_playlists')) || [];
            
            loadArticles();
            loadPlaylists();
        });

        // Recargar cuando se vuelve a la página (desde el editor)
        window.addEventListener('focus', () => {
            articles = JSON.parse(localStorage.getItem('etherfiles_music_articles')) || [];
            playlists = JSON.parse(localStorage.getItem('etherfiles_music_playlists')) || [];
            loadArticles();
            loadPlaylists();
        });
    </script>
</body>

</html>
